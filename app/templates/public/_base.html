<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}{{ tenant.name if tenant else "Appointment" }}{% endblock %}</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1c1e21; --muted: #6b7280; --line: #e3e5e8;
    --accent: #1d4ed8; --accent-soft: #eef2ff; --accent-line: #c7d2fe;
    --ok-bg: #f0fdf4; --ok-line: #bbf7d0; --ok-text: #166534;
    --err-bg: #fef2f2; --err-line: #fecaca; --err-text: #991b1b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #e8eaed; --muted: #9aa1ac; --line: #2a2f38;
      --accent: #6d8bff; --accent-soft: #1c2440; --accent-line: #34407a;
      --ok-bg: #0f2318; --ok-line: #1f5133; --ok-text: #86efac;
      --err-bg: #2a1414; --err-line: #5b2020; --err-text: #fca5a5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  .eyebrow { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 6px; }
  h2 { font-size: 15px; margin: 22px 0 10px; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); }
  .notice { border-radius: 10px; padding: 14px 16px; margin: 0 0 18px; border: 1px solid; }
  .notice.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-text); }
  .notice.err { background: var(--err-bg); border-color: var(--err-line); color: var(--err-text); }
  .notice strong { display: block; font-size: 18px; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .slot input { position: absolute; opacity: 0; pointer-events: none; }
  .slot span { display: block; text-align: center; padding: 11px 8px; border: 1px solid var(--accent-line);
               border-radius: 9px; background: var(--accent-soft); cursor: pointer; font-size: 15px; }
  .slot input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .slot input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { margin-top: 22px; width: 100%; padding: 14px; border: 0; border-radius: 10px; background: var(--accent);
           color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  a { color: var(--accent); }
  footer { margin-top: 18px; font-size: 14px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
