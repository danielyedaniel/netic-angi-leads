<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ tenant_name }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:10px;border:1px solid #e3e5e8;">
<tr><td style="padding:28px 28px 8px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;color:#1c1e21;">
<p style="margin:0 0 4px 0;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#6b7280;">{{ tenant_name }}</p>
{% block body %}{% endblock %}
</td></tr>
<tr><td style="padding:8px 28px 24px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#8a8f98;border-top:1px solid #eef0f2;">
{% block footer %}
<p style="margin:14px 0 0 0;">You're getting this because you asked for a pro through Angi.
<a href="{{ unsubscribe_url }}" style="color:#8a8f98;">Stop emails from {{ tenant_name }}</a>.</p>
{% endblock %}
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
