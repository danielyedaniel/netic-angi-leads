[project]
name = "netic-angi-leads"
version = "0.1.0"
description = "Angi lead-source integration: receive leads, map them to a tenant, store them, and start appointment booking by email"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "email-validator>=2.1",
    "certifi>=2024.2.2",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
